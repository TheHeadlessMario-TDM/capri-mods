name: Mod checks

on:
  pull_request:
    paths:
      - 'mods/**'
      - 'tools/check-mods.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - run: python3 -I tools/test_check_mods.py

      - if: github.event_name == 'pull_request'
        run: python3 -I tools/check-mods.py --changed "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

      - if: github.event_name == 'workflow_dispatch'
        run: python3 -I tools/check-mods.py --all
